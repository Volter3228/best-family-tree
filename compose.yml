services:
  postgres:
    image: postgres:17-alpine
    container_name: best-family-tree-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: best_family_tree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./src/server
      dockerfile: Dockerfile.dev
    container_name: best-family-tree-backend
    ports:
      - "3001:3001"
      - "51212:51212"
    environment:
      - NODE_ENV=development
      - PORT=3001
    env_file:
      - ./src/server/.env
    volumes:
      - ./src/server:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: best-family-tree-frontend
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - API_URL_INTERNAL=http://backend:3001/api
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - /app/src/server
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
